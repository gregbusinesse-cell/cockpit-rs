[package]
name = "cockpit"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cockpit : les chiffres de tes apps et de tes vidéos, au même endroit."
default-run = "cockpit-app"

# la CLI s'appelle déjà `cockpit`, et Cockpit la remplacerait sur un disque insensible à la casse (Mac, Windows)
[[bin]]
name = "cockpit-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
noyau.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
parking_lot.workspace = true
chrono.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
url = "2"
